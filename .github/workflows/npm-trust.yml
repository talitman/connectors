name: npm trusted publishing

# One-off maintenance: registers this repo's release.yml as the trusted
# publisher (OIDC) for the public packages, so releases need no NPM_TOKEN.
# Needs NPM_TOKEN only for the registration itself.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package names to register
        default: '@talitman/core @talitman/config @talitman/observability @talitman/whatsapp'
        required: true

permissions:
  contents: read

jobs:
  trust:
    name: Register release.yml as trusted publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that has `npm trust`
        run: npm install -g npm@latest && npm --version

      - name: Register and verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          for pkg in ${{ inputs.packages }}; do
            echo "== $pkg"
            npm trust github "$pkg" --file release.yml --repo "${{ github.repository }}" --yes
            npm trust list "$pkg"
          done
