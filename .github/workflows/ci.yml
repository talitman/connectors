name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format check
        run: pnpm lint

  docker:
    name: Docker image builds and answers /health
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/whatsapp-service/Dockerfile -t connectors-whatsapp-service:ci .

      - name: Smoke test /health
        run: |
          docker run -d --rm --name wa-smoke -p 3000:3000 connectors-whatsapp-service:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "service did not become healthy"; docker logs wa-smoke; exit 1

      - name: Stop container
        if: always()
        run: docker rm -f wa-smoke >/dev/null 2>&1 || true
